name: Validate signer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check cryptography==48.0.1 pytest==8.4.2
      - run: pytest -q
      - run: python -m py_compile scripts/*.py
      - name: Reject accidental sensitive material
        run: |
          set -euo pipefail
          ! grep -R -I -E --exclude-dir=.git --exclude='*.sealed.json' --exclude='validate.yml' \
            '(BEGIN (RSA |ENCRYPTED )?PRIVATE KEY|ghp_|github_pat_|bot[0-9]+:|TELEGRAM.*TOKEN|-100[0-9]{6,20})' .
